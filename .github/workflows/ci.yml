name: Build and release extension

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - name: Exercise the extracted VSIX with no Node on its PATH
        shell: pwsh
        run: ./scripts/smoke-vsix.ps1
      - name: Validate release version and checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release.cjs "$env:RELEASE_TAG"
      - name: Retain tested VSIX
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jade-vscode-extension
          path: |
            dist/*.vsix
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release-guard:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/release-ancestry.yml

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, release-guard]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-consumer.yml
    with:
      artifact_name: jade-vscode-extension
      consumer_automation_ref: ${{ github.sha }}
