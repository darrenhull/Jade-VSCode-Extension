name: Update a consumer's pinned Jade CLI

on:
  workflow_call:
    inputs:
      cli_tag:
        type: string
        default: ''
      consumer_automation_ref:
        type: string
        required: true
      update_script:
        type: string
        default: scripts/update-cli.cjs
      package_script:
        type: string
        default: package
      release_script:
        type: string
        default: scripts/release.cjs
      release_args_json:
        type: string
        default: '[]'
      ci_workflow:
        type: string
        default: ci.yml
      standalone_executable:
        type: string
        default: ''
      standalone_env:
        type: string
        default: ''
      standalone_archive:
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate immutable native automation reference
        shell: pwsh
        env:
          AUTOMATION_REF: ${{ inputs.consumer_automation_ref }}
        run: |
          if ($env:AUTOMATION_REF -notmatch '^[a-f0-9]{40}$') { throw 'Pin consumer automation to an immutable commit.' }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: darrenhull/Jade-VSCode-Extension
          ref: ${{ inputs.consumer_automation_ref }}
          path: .jade-automation
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download and verify the CLI release
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ inputs.cli_tag }}
          UPDATE_SCRIPT: ${{ inputs.update_script }}
          JADE_NATIVE_UPDATER_SCRIPT: ${{ github.workspace }}/.jade-automation/scripts/update-native-cli.ps1
        run: node "$env:UPDATE_SCRIPT" "$env:CLI_TAG"
      - name: Validate the reviewed dependency
        if: steps.cli.outputs.updated == 'true'
        shell: pwsh
        env:
          UPDATE_SCRIPT: ${{ inputs.update_script }}
          JADE_NATIVE_UPDATER_SCRIPT: ${{ github.workspace }}/.jade-automation/scripts/update-native-cli.ps1
          PACKAGE_SCRIPT: ${{ inputs.package_script }}
          RELEASE_SCRIPT: ${{ inputs.release_script }}
          RELEASE_ARGS_JSON: ${{ inputs.release_args_json }}
          STANDALONE_EXECUTABLE: ${{ inputs.standalone_executable }}
          STANDALONE_ENV: ${{ inputs.standalone_env }}
          STANDALONE_ARCHIVE: ${{ inputs.standalone_archive }}
        run: |
          node "$env:UPDATE_SCRIPT" --verify-lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run --if-present build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run "$env:PACKAGE_SCRIPT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RELEASE_TAG = 'v' + (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $releaseArgs = @(ConvertFrom-Json $env:RELEASE_ARGS_JSON)
          node "$env:RELEASE_SCRIPT" @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:STANDALONE_EXECUTABLE) {
            if ($env:STANDALONE_ENV -notmatch '^JADE_[A-Z_]+$') { throw 'Set a valid standalone test environment variable.' }
            if (-not $env:STANDALONE_ARCHIVE) { throw 'Provide the complete standalone ZIP for isolation testing.' }
            $proofRoot = Join-Path $env:RUNNER_TEMP ('jade-consumer-proof-' + [guid]::NewGuid().ToString('N'))
            Expand-Archive -LiteralPath $env:STANDALONE_ARCHIVE -DestinationPath $proofRoot
            $proofExecutable = Join-Path $proofRoot (Split-Path -Leaf $env:STANDALONE_EXECUTABLE)
            Set-Item -Path ('Env:' + $env:STANDALONE_ENV) -Value $proofExecutable
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Create reviewed dependency pull request
        if: steps.cli.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLI_BRANCH: ${{ steps.cli.outputs.branch }}
          CLI_TAG: ${{ steps.cli.outputs.tag }}
          CLI_SHA: ${{ steps.cli.outputs.sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
        shell: pwsh
        run: |
          $existing = gh pr list --head "$env:CLI_BRANCH" --state all --json url --jq '.[0].url // empty'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing) {
            "A pull request already exists for this release: $existing" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$env:CLI_BRANCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -- package.json package-lock.json packages
          git commit -m "Update Jade CLI to $env:CLI_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push --set-upstream origin "$env:CLI_BRANCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @"
          Update the committed native C++ CLI distribution and hash pin to $env:CLI_TAG.

          SHA-256: $env:CLI_SHA

          The official release URL, download/expanded-size limits, archive paths, version and native runtime hashes were verified. Consumer tests, packaging and release checks passed before this PR was opened. CI is explicitly dispatched on this branch as well. This updates the native dependency for review; it does not publish a consumer release or modify a Jade database.
          "@ | Set-Content -LiteralPath dist/cli-update-pr.md -Encoding utf8
          gh pr create --base "$env:BASE_BRANCH" --head "$env:CLI_BRANCH" --title "Update Jade CLI to $env:CLI_TAG" --body-file dist/cli-update-pr.md --reviewer darrenhull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh workflow run "$env:CI_WORKFLOW" --ref "$env:CLI_BRANCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
