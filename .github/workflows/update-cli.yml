name: Update pinned Jade CLI

on:
  schedule:
    # Refresh the schedule registration; GitHub delivery remains best-effort.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      cli_tag:
        description: 'CLI release tag (blank selects latest stable release)'
        required: false
        type: string
  repository_dispatch:
    types: [jade-cli-released]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pinned-cli
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/update-consumer.yml
    with:
      cli_tag: ${{ inputs.cli_tag || github.event.client_payload.cli_tag || '' }}
