name: Update pinned Jade CLI

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      cli_tag:
        description: 'CLI release tag (blank selects latest stable release)'
        required: false
        type: string
  repository_dispatch:
    types: [jade-cli-released]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-pinned-cli
  cancel-in-progress: false

jobs:
  update:
    uses: darrenhull/Jade-CLI/.github/workflows/update-consumer.yml@fd723456490a67d04ce6f5cc27496b03601d7e74
    with:
      cli_tag: ${{ inputs.cli_tag || github.event.client_payload.cli_tag || '' }}
